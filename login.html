<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | CAR-ZONE</title>
    <link rel="stylesheet" href="css/login.css">
</head>
<body>

    <div class="auth-container">
        <a href="index.html" class="logo">CAR<span>-ZONE</span></a>

        <div class="auth-card">
            <div class="auth-tabs">
                <button type="button" id="loginTab" class="active">Login</button>
                <button type="button" id="registerTab">Register</button>
            </div>

            <form id="loginForm">
                <h2>Welcome Back!</h2>
                <p>Login to continue to CAR-ZONE.</p>

                <label for="loginEmail">Email Address</label>
                <input type="email" id="loginEmail" required placeholder="Enter your email">

                <label for="loginPassword">Password</label>
                <input type="password" id="loginPassword" required placeholder="Enter your password">

                <button type="submit" class="auth-btn">Login</button>
                <p id="loginMessage" class="message"></p>

                <p class="switch-text">
                    Don't have an account?
                    <a href="#" id="showRegister">Register</a>
                </p>
            </form>

            <form id="registerForm" class="hidden">
                <h2>Create Account</h2>
                <p>Join CAR-ZONE today.</p>

                <label for="registerName">Full Name</label>
                <input type="text" id="registerName" required placeholder="Enter your full name">

                <label for="registerEmail">Email Address</label>
                <input type="email" id="registerEmail" required placeholder="Enter your email">

                <label for="registerPassword">Password</label>
                <input type="password" id="registerPassword" required minlength="6" placeholder="Minimum 6 characters">

                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" required minlength="6" placeholder="Confirm your password">

                <button type="submit" class="auth-btn">Create Account</button>
                <p id="registerMessage" class="message"></p>

                <p class="switch-text">
                    Already have an account?
                    <a href="#" id="showLogin">Login</a>
                </p>
            </form>
        </div>

        <a href="index.html" class="back-home">← Back to Home</a>
    </div>

    <script src="js/login.js"></script>
</body>
</html>
